<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lire les livres d’exemple d’Orelius, directement dans le navigateur.">
  <title>Livres d’exemple — Orelius</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ia-writer-duo.css">
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js" integrity="sha384-ZqmkDa/1AGF4SKdSmXgEG+3G+Gsb6yNqUSq2Mqp0jDf1GWk+UY5eNbEd7hgwiywI" crossorigin="anonymous"></script>
  <script type="module" src="reader.js"></script>
</head>
<body>
  <main id="home" class="library">
    <h1>Livres disponibles</h1>
    <nav aria-label="Livres disponibles"><ul id="books"></ul></nav>
  </main>
  <section id="reader" class="reader" aria-label="Lecture" hidden>
    <div id="viewer" aria-label="Contenu du livre" aria-busy="false"></div>
    <button id="previous-page" class="page-button previous-page" type="button" aria-label="Page précédente" title="Page précédente" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button id="next-page" class="page-button next-page" type="button" aria-label="Page suivante" title="Page suivante" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <button id="menu-button" class="menu-button" type="button" aria-label="Ouvrir le menu de lecture" aria-haspopup="dialog" aria-controls="reader-menu" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </section>
  <dialog id="reader-menu" aria-labelledby="book-title">
    <div class="menu-heading">
      <h2 id="book-title">Lecture</h2>
      <button id="close-menu" type="button" aria-label="Fermer le menu">×</button>
    </div>
    <div class="font-size-control" role="group" aria-label="Taille du texte">
      <span>Taille du texte</span>
      <button id="smaller" type="button" aria-label="Réduire la taille du texte" disabled>A−</button>
      <output id="font-size" aria-live="polite">100 %</output>
      <button id="larger" type="button" aria-label="Augmenter la taille du texte" disabled>A+</button>
    </div>
    <label for="font-family">Police</label>
    <select id="font-family" disabled>
      <option value="" selected>Police du livre</option>
      <option value="'iA Writer Duo V', monospace">iA Writer Duo</option>
      <option value="system-ui, sans-serif">Police système</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="Arial, sans-serif">Arial</option>
      <option value="Verdana, sans-serif">Verdana</option>
      <option value="ui-serif, serif">Serif système</option>
    </select>
    <label for="reading-format">Format</label>
    <select id="reading-format" disabled>
      <option value="paginated" selected>Livre (pages)</option>
      <option value="scrolled">Défilement continu</option>
    </select>
    <details id="contents">
      <summary>Sommaire</summary>
      <nav aria-label="Sommaire du livre"><ol id="chapters"></ol></nav>
    </details>
    <a id="download-epub" download hidden>Télécharger l’EPUB</a>
    <button id="return-home" type="button">Retour à l’accueil</button>
  </dialog>
  <p id="status" role="status" aria-live="polite">Chargement de la bibliothèque…</p>
  <noscript>Active JavaScript pour ouvrir les livres dans le lecteur.</noscript>
</body>
</html>
