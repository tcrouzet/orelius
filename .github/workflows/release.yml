name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Validate and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash -n release.sh
          shellcheck release.sh
          npm ci --ignore-scripts
          npm run check:release
          npm run build
          node -e 'const assert = require("node:assert/strict"); const fs = require("node:fs"); const read = path => JSON.parse(fs.readFileSync(path, "utf8")); const tag = process.env.RELEASE_TAG; assert.match(tag, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/); const manifest = read("manifest.json"); assert.equal(manifest.version, tag); assert.deepEqual(manifest, read("plugin/manifest.json")); assert.equal(read("package.json").version, tag); assert.equal(read("package-lock.json").version, tag); assert.equal(read("package-lock.json").packages[""].version, tag); assert.equal(read("versions.json")[tag], manifest.minAppVersion);'
          test -s main.js && test -s manifest.json && test -s styles.css
      - name: Publish plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" main.js manifest.json styles.css \
            --verify-tag --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
